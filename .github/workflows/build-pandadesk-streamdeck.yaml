name: PandaDesk build and release

on:
  push:
    branches: ['**']
    paths:
      - 'pandadesk/**'
      - '.github/workflows/build-pandadesk-streamdeck.yaml'
  pull_request:
    paths:
      - 'pandadesk/**'
      - '.github/workflows/build-pandadesk-streamdeck.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: pandadesk
    outputs:
      name: ${{ steps.plugin.outputs.name }}
      version: ${{ steps.plugin.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pandadesk/package-lock.json

      - name: Read plugin name and version
        id: plugin
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';

          const { Name, Version } = JSON.parse(readFileSync('de.pandaboards.pandadesk.sdPlugin/manifest.json', 'utf8'));
          assert(typeof Name === 'string' && Name.trim() && !/[\r\n]/.test(Name), 'Invalid plugin name');
          assert(typeof Version === 'string' && /^\d+\.\d+\.\d+\.\d+$/.test(Version), 'Invalid plugin version');
          appendFileSync(process.env.GITHUB_OUTPUT, `name=${Name}\nversion=${Version}\n`, 'utf8');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Validate and package
        run: npm run pack -- --no-update-check

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: pandadesk-${{ steps.plugin.outputs.version }}
          path: pandadesk/dist/*.streamDeckPlugin
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pandadesk-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pandadesk-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish plugin release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLUGIN_NAME: ${{ needs.build.outputs.name }}
          PLUGIN_VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="pandadesk/v${PLUGIN_VERSION}"
          if gh release view "$tag" --json tagName > /dev/null 2>&1; then
            echo "Release $tag already exists; bump the manifest Version to publish a new release."
            exit 0
          fi
          gh release create "$tag" dist/*.streamDeckPlugin \
            --target "$GITHUB_SHA" \
            --title "${PLUGIN_NAME} v${PLUGIN_VERSION}" \
            --notes "Install the attached .streamDeckPlugin file using Elgato Stream Deck. Built from commit ${GITHUB_SHA}."
